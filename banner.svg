<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0325"/>
      <stop offset="55%" stop-color="#1e0a4a"/>
      <stop offset="100%" stop-color="#2d1169"/>
    </linearGradient>
